name: Auto-assign author and request reviewer
on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  auto-assign:
    runs-on: ubuntu-latest
    steps:
      - name: Assign PR author as assignee
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const repo = context.repo.repo;
            const owner = context.repo.owner;
            const author = context.actor;
            const reviewer = 'michalbednarczyk1993';

            // always assign the author
            await github.rest.issues.addAssignees({
              issue_number: prNumber,
              owner,
              repo,
              assignees: [author]
            });

#            // only ask for review if michalbednarczyk1993 ≠ PR author
#            if (reviewer !== author) {
#              await github.rest.pulls.requestReviewers({
#                pull_number: prNumber,
#                owner,
#                repo,
#                reviewers: [reviewer]
#              });
#            }
